name: Known Words Branch Check

on:
  push:
    branches:
      - feat/known-words
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/known-words
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Syntax and stale-reference checks
        shell: bash
        run: |
          set -euo pipefail
          luac_bin="$(command -v luac5.1 || command -v luac)"
          while IFS= read -r -d '' file; do
            "$luac_bin" -p "$file"
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)

          python3 -m py_compile tools/*.py
          git diff --check

          if grep -R --include='*.lua' -n 'wordgloss_vocab\|self\.vocab\|deps\.vocab' .; then
            echo "stale vocabulary bridge reference found" >&2
            exit 1
          fi

      - name: Test classification priority and word keys
        shell: bash
        run: |
          set -euo pipefail
          lua5.1 <<'LUA'
          package.path = "./?.lua;" .. package.path

          package.preload["logger"] = function()
              return { warn = function() end, err = function() end, dbg = function() end }
          end

          local Lexicon = require("wordgloss_lexicon")
          local lex = Lexicon:new(".")
          lex.resolve = function(_, word)
              if word == "said" then return 19, nil, "say" end
              if word == "taken" then return 100, "take", "take" end
              if word == "takes" then return 100, nil, "take" end
              return 9000, nil, nil
          end

          assert(lex:classify("said", { rank_limit = 3000 }) == nil)
          local forced = lex:classify("said", {
              rank_limit = 3000,
              forced_words = { said = true },
          })
          assert(forced and forced.forced == true)

          assert(lex:classify("said", {
              rank_limit = 3000,
              forced_words = { said = true },
              known_words = { said = true },
          }) == nil)

          assert(lex:classify("said", {
              rank_limit = 3000,
              forced_words = { say = true },
              known_words = { say = true },
          }) == nil)

          package.preload["datastorage"] = function()
              return { getSettingsDir = function() return "/tmp" end }
          end
          package.preload["libs/libkoreader-lfs"] = function()
              return { attributes = function() return nil end }
          end

          local Words = require("wordgloss_words")
          local words = Words:new{ lexicon = lex }

          assert(words:known_key("taken") == "take")
          assert(words:known_key("said") == "said")

          words._known = { take = true }
          assert(words:isKnown("taken"))
          assert(words:isKnown("takes"))
          assert(not words:isKnown("said"))

          words._known = { said = true }
          assert(words:isKnown("said"))
          assert(not words:isKnown("takes"))

          print("known-word state tests passed")
          LUA

      - name: Test dictionary action adapter
        shell: bash
        run: |
          set -euo pipefail
          lua5.1 <<'LUA'
          package.path = "./?.lua;" .. package.path
          package.preload["gettext"] = function()
              return function(s) return s end
          end

          local DictActions = require("wordgloss_dict_actions")
          local spec
          local state = false
          local refreshed = false
          local plugin = {
              ui = {
                  dictionary = {
                      addToDictButtons = function(_, value) spec = value end,
                  },
              },
              words = {
                  isKnown = function() return state end,
                  known_key = function(_, word) return word and word:lower() end,
                  addKnown = function() state = true return true end,
                  removeKnown = function() state = false return true end,
              },
              scheduleGlossRefresh = function() refreshed = true end,
          }

          assert(DictActions.register(plugin))
          assert(spec and spec.id == "wordgloss_known")
          local popup = {
              lookupword = "Example",
              onClose = function(self) self.closed = true end,
          }

          assert(spec.text_func(popup) == "WordGloss：我已掌握")
          spec.callback(popup)
          assert(state == true and popup.closed == true and refreshed == true)
          assert(spec.text_func(popup) == "WordGloss：取消已掌握")
          LUA
