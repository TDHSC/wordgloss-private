name: Vocab Fix Branch Check

on:
  push:
    branches:
      - fix/vocab-builder-override
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vocab-builder-override
          fetch-depth: 0

      - name: Upgrade compact lexicon to schema v2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             https://raw.githubusercontent.com/skywind3000/ECDICT/master/lemma.en.txt             -o /tmp/lemma.en.txt

          python3 - <<'PY'
          import re
          import sqlite3
          from pathlib import Path

          db_path = Path("data/wordgloss_en.sqlite3")
          lemma_path = Path("/tmp/lemma.en.txt")
          alpha = re.compile(r"^[a-z]{2,24}$")

          conn = sqlite3.connect(db_path)
          cols = {row[1] for row in conn.execute("pragma table_info(lex)")}
          if "lemma" not in cols:
              conn.execute("alter table lex add column lemma text")

          rows = {
              word: (int(rank), base)
              for word, rank, base in conn.execute("select word, rank, base from lex")
          }

          # Existing synthetic form rows already use base as their gloss fallback.
          conn.execute("update lex set lemma = base where base is not null and base <> ''")

          mapped = 0
          with lemma_path.open("r", encoding="utf-8", errors="ignore") as handle:
              for line in handle:
                  line = line.strip()
                  if not line or line.startswith(";"):
                      continue
                  split = line.find("->")
                  if split <= 0:
                      continue
                  stem = line[:split].strip().split("/")[0].strip()
                  if not alpha.match(stem) or stem not in rows:
                      continue
                  stem_rank, stem_base = rows[stem]
                  # Lemma stems in the original compact pack are ranked rows.
                  if stem_base not in (None, ""):
                      continue
                  for raw in line[split + 2:].split(","):
                      form = raw.split("/")[0].strip()
                      if not alpha.match(form) or form == stem or form not in rows:
                          continue
                      rank, base = rows[form]
                      if base in (None, ""):
                          conn.execute(
                              "update lex set rank = ?, lemma = ? where word = ?",
                              (min(rank, stem_rank), stem, form),
                          )
                          mapped += 1

          conn.execute(
              "insert or replace into meta(key, value) values('format', '2')"
          )
          conn.execute(
              "insert or replace into meta(key, value) "
              "values('note', 'effective difficulty rank + separate lemma; gloss base preserved')"
          )
          conn.commit()

          said = conn.execute(
              "select rank, base, lemma from lex where word='said'"
          ).fetchone()
          say = conn.execute(
              "select rank, base, lemma from lex where word='say'"
          ).fetchone()
          assert said and say, (said, say)
          assert said[2] == "say", said
          assert said[1] in (None, ""), said
          assert int(said[0]) <= int(say[0]), (said, say)

          fmt = conn.execute(
              "select value from meta where key='format'"
          ).fetchone()
          assert fmt and fmt[0] == "2", fmt
          conn.close()
          print("ranked inflections mapped:", mapped)
          print("said:", said, "say:", say)
          PY

      - name: Validate Lua and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac_bin="$(command -v luac5.1 || command -v luac)"
          while IFS= read -r -d '' file; do
            "$luac_bin" -p "$file"
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
          python3 -m py_compile tools/*.py
          git diff --check

      - name: Commit upgraded data pack
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/wordgloss_en.sqlite3; then
            echo "Data pack already upgraded."
            exit 0
          fi
          git config user.name "wordgloss-ci"
          git config user.email "wordgloss-ci@users.noreply.github.com"
          git add data/wordgloss_en.sqlite3
          git commit -m "fix: upgrade lexicon lemma metadata"
          git push origin HEAD:fix/vocab-builder-override
